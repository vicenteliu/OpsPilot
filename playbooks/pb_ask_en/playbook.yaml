# Playbook: pb_ask_en
# The ask (ADR-0040, decision 5); artifact schema = work_item_ask_v1
# Called only when decision 4 stands at `no`: the Work item does not say enough
# for an engineer to start, so the reporter is asked once before any summary.

id: "pb_ask_en"
version: "1.0.0"

description: |
  Write the one message OpsPilot sends the reporter of a redacted IT work item
  that does not yet say enough to act on (#229). Single-shot, no KB retrieval,
  no tools. Output conforms to work_item_ask_v1 {ask}.

system_prompt: "prompt.md"
output_schema: "work_item_ask_v1"

model:
  provider_id: "anthropic"
  kind: "anthropic"
  name: "claude-haiku-5-5"
  version: "2025-01"
  params:
    # As the classifier: Haiku 5.5 rejects a non-default temperature or top_p,
    # and thinking counts toward max_tokens.
    thinking: "adaptive"
    effort: "low"
    max_tokens: 2048

defaults:
  retention_class: "low"
  sensitivity: "internal"
  kb_id: "opspilot:public-kb"
