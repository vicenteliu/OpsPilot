name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behaviour-gate-evidence:
    # Four of this product's behaviours are produced by a prompt, not by code:
    # an injected Memory constraint changing an answer, a Memory ↔ KB
    # contradiction being reported, a distilled Skill keeping its dead ends and
    # its blanks, and an opted-in playbook proposing only read-only diagnostics.
    # A reworded instruction can stop any of them, and none of them raises.
    #
    # `make test-behaviour` checks them by calling hosted models, which cannot
    # run here: on a public repo that means forks have no key, every PR costs
    # money, and model non-determinism turns the gate red for unrelated reasons
    # — and a gate that cries wolf is one people learn to ignore.
    #
    # So CI does not run the gate. It makes sure the gate was run: touching the
    # files those behaviours depend on fails until the PR body carries the
    # result. Pasting a false line is possible and is then a deliberate false
    # statement in a permanent record, which is the point.
    name: Behaviour gate (evidence)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did this PR touch a prompt-driven behaviour?
        id: touched
        run: |
          # Deliberately file-level and over-triggering. Being asked to run the
          # gate unnecessarily costs minutes; missing the change it exists for
          # costs the reason it exists.
          PROTECTED='
          src/opspilot/orchestrator/chat_agent.py
          src/opspilot/orchestrator/ticket_summary.py
          src/opspilot/memory/inject.py
          src/opspilot/consultation/distil.py
          src/opspilot/sandbox/proposals.py
          docs/specs/orchestrator/schemas/incident_summary_v1.schema.json
          '
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          HIT=""
          for f in $PROTECTED; do
            echo "$CHANGED" | grep -qxF "$f" && HIT="$HIT $f"
          done
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"
      - name: Require the gate's result in the PR body
        if: steps.touched.outputs.hit != ''
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "This PR changes prompt-driven behaviour:${{ steps.touched.outputs.hit }}"
          if echo "$BODY" | grep -qiE '^behaviour-gate:'; then
            echo "Found the gate result:"
            echo "$BODY" | grep -iE '^behaviour-gate:'
            exit 0
          fi
          echo ""
          echo "Run it and paste the result into the PR body:"
          echo "    make test-behaviour"
          echo "    behaviour-gate: 4/4 passed (votes 3/3, 3/3, 3/3, 3/3)"
          echo ""
          echo "It is not run here on purpose — see this job's comment in ci.yml."
          exit 1

  python:
    name: Python (lint + type + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Type-check (mypy)
        run: mypy src/
      - name: Test (pytest)
        # Mirrors `make test`: skips slow + live-Ollama tests.
        run: pytest tests/ -m "not slow and not requires_ollama"

  web:
    name: Web (svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check (svelte-check)
        run: pnpm check
      - name: Build
        run: pnpm build

  rust-bench:
    name: Rust extensions (build + bench ≥5×)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build extensions (release) and benchmark
        # maturin develop installs into the venv; the bench scripts exit 1 if the
        # Rust speedup over the pure-Python path drops below 5× (~10× / ~42× local).
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]" maturin
          (cd crates/opspilot-chunker && maturin develop --release)
          (cd crates/opspilot-tokenizer && maturin develop --release)
          make bench
