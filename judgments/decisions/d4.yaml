# Decision 4 (ADR-0040): enough to act on?
#
# Asked of an Incident. A Noul: when it stands at `no`, the summary does not
# run; the Playbook's model writes one ask instead (decision 5), and the
# reporter's reply re-enters the stage here. Below its cut, the summary runs
# as before and lists what is missing. The answer space the label set's
# `enough` column is labelled against (judgments/label_set/SPEC.md, d4-v1).
id: d4
version: d4-v1
kind: noul
question: >-
  Is there enough in this Work item for an engineer to start on it without
  asking the reporter first?
answers:
  # Quoted: unquoted, YAML reads yes and no as true and false.
  "yes": >-
    It says what is wrong, who or what is affected, and enough of where, since
    when, or what was seen (an error, a message) to start diagnosing.
  "no": >-
    An engineer would have to ask first: what is broken, who or where, since
    when, or what they saw is missing.
# Set from the label set, never guessed (SPEC §7), keyed by the engine it was
# measured on (#274). The stage acts only on a `no` that clears it, so each is
# the asks' cut in judgments/label_set/report_d4_v1.md, run on 2026-10-16 over
# the 39 Incidents, three passes each: the lowest P(no) at which the Work items
# asked about are at least 95% labelled `no`.
#
# 0.64 on Jev's probability: 12 of 117 asked, all labelled `no`, and every
#   `no` asked (12 of 12); no `yes` asked.
# 0.77 on the Playbook's model: 4 asked, all `no`, but only 4 of the 12.
#
# Only 4 of the 39 Incidents are labelled `no`, so this rests on very little.
# Measure again when the label set grows, or when either model changes.
thresholds:
  "typesafe:jev-1.13.0": 0.64
  "playbook:anthropic/claude-haiku-5-5": 0.77
