# Decision 1 (ADR-0040): is this a security issue?
#
# The answer space the label set's `security` column is labelled against
# (judgments/label_set/SPEC.md, d1-v2). Changing a definition changes what the
# labels mean, so it takes a new version, and a relabel.
id: d1
version: d1-v2
kind: noul
question: >-
  Does this Work item report, or may it report, a security event: a sign of
  compromise or exposure?
answers:
  # Quoted: unquoted, YAML reads yes and no as true and false.
  "yes": >-
    It shows a sign of compromise or exposure: a suspicious link, attachment or
    message; an unexpected sign-in, MFA prompt or account change; a lost or
    stolen device; malware behaviour; a password or other credential that
    someone else may have, or that was shared with or asked for by someone who
    should not have it; data sent to, or seen by, the wrong people. When in
    doubt about compromise or exposure, yes.
  "no": >-
    Nothing in it suggests compromise or exposure. A routine request or fault
    about access, accounts, passwords, MFA, keys or certificates is no unless it
    shows one of the signs above.
# d1-v1 counted any credential "shared or requested". On the label set, the 28
# rows it labelled yes beyond the 12 written as security items scored like the
# rows labelled no for both engines, so a cut that stopped them all stopped
# nearly every Work item (report_d1_v1.md). d1-v2 keeps the signs of compromise
# and makes routine asks no.
#
# The blind d1-v2 relabel still labelled 29 such rows yes, and both engines
# still scored them like the no rows (#281). Asked which of the signs above
# each shows (judgments/label_set/signs_d1_v2.yaml), the labeller named none in
# 27, routine requests and faults about encryption, certificates, VPN, sign-in
# and access, and doubt in 2; the 27 are labelled no, the 2 stay yes. A Lookup
# of the signs written as patterns had found 2 of the 41 then labelled yes, so
# the Judgment alone decides.
#
# Set from the label set, never guessed (ADR-0040): the highest P(yes) at which
# every labelled security item reaches a person, keyed by the engine it was
# measured on (#274). From judgments/label_set/report_d1_v2.md, recomputed on
# 2026-10-17 from its saved runs over the 80 rows, three passes each, with 14
# labelled yes:
#
# 0.10 on Jev's P(yes): stops 55 of 240 answers, 13 of the 198 labelled no.
# 0.30 on the Playbook's model: stops 45 of 240, 3 of the 198 labelled no.
#
# 14 security items is few: measure again when the label set grows, or when
# JEV_MODEL or the classification Playbook's model changes. As for d2.yaml,
# the stage refuses to start when the engine that would decide has no entry
# here (#301).
#
# On the Chinese set (report_d1_zh_v1.md, 2026-10-17, #233), these cuts stop
# all 12 security items there too: Jev stops 47 of 240 answers, 11 of the 204
# labelled no; the Playbook's model, through pb_classify_work_item_zh, 42 and
# 6. Its own cuts there, 0.47 and 0.90, rest on 12 items drafted to show their
# sign plainly, so the lower English cuts serve both languages.
thresholds:
  "typesafe:jev-1.13.0": 0.10
  "playbook:anthropic/claude-haiku-5-5": 0.30
