# Decision 1 (ADR-0040): is this a security issue?
#
# The answer space the label set's `security` column is labelled against
# (judgments/label_set/SPEC.md, d1-v1). Changing a definition changes what the
# labels mean, so it takes a new version, and a relabel.
id: d1
version: d1-v1
kind: noul
question: >-
  Does this Work item report, or may it report, a security event (a phishing
  link, a strange sign-in, a lost device)?
answers:
  # Quoted: unquoted, YAML reads yes and no as true and false.
  "yes": >-
    It could involve compromise or exposure: a suspicious link or attachment, an
    unexpected sign-in or MFA prompt, a lost or stolen device, malware
    behaviour, credentials shared or requested, data sent to the wrong place.
    When in doubt, yes.
  "no": >-
    None of the above: nothing in it could involve compromise or exposure.
# Set from the label set, never guessed (ADR-0040): the value at which every
# labelled security item reaches a person. Keyed by the engine it was measured
# on (#274), and empty until that report has been run.
thresholds: {}
