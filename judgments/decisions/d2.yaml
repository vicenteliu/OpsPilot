# Decision 2 (ADR-0040): incident or request?
#
# The answer space is the one the label set is labelled against
# (judgments/label_set/SPEC.md, d2-v1). Changing a definition changes what the
# labels mean, so it takes a new version, and a relabel.
id: d2
version: d2-v1
kind: choice
question: Is this Work item an incident or a service request?
answers:
  incident: >-
    Something is broken or degraded. It worked, or should work, and doesn't.
  service_request: >-
    An ask for something standard: access, an account, software, hardware, a
    change to a mailbox or group. Nothing is broken.
# Set from the label set, never guessed (SPEC §7): the lowest probability at
# which the items routed without a person are at least 95% right. Keyed by the
# engine it was measured on: a probability is on its engine's own scale, so
# the stage refuses to start when the engine that would decide has no entry
# here (#274).
#
# Each engine's cut is the stricter of the two sets' (#233, the user's choice
# on 2026-10-17): the engine name does not say which language a Work item is
# in, so one cut serves both, and it is the one that keeps both at least 95%
# right. Measured on the same rows it is reported on, with no held-out split,
# so measure again when either set grows, or JEV_MODEL or the classification
# Playbook's model changes. The stage applies it to its primary engine only;
# an answer from the fallback always goes to a person.
#
# 0.99 on Jev's probability (typesafe:jev-1.13.0):
#   English, report_v1.md (2026-10-11): its own cut 0.94 routes 208 of 240
#     answers (three passes over 80 rows), 95.2% right; at 0.99, 190, 96.8%.
#   Chinese, report_zh_v1.md (2026-10-17): its own cut 0.99 routes 192 of 240,
#     95.3% right; at the English 0.94, 201, only 94.0%.
#
# 0.78 on the Playbook's model (playbook:anthropic/claude-haiku-5-5), which
# decides only without TYPESAFE_API_KEY:
#   English, report_v1.md (2026-10-12): its own cut 0.70 routes 200 of 240,
#     95.5% right; at 0.78, 177, 97.2%.
#   Chinese, through pb_classify_work_item_zh: its own cut 0.78 routes 176 of
#     240, 98.9% right; at the English 0.70, 200, only 92.5%.
# Its 0.75 on claude-haiku-4-5 is history, not a cut for this model.
thresholds:
  "typesafe:jev-1.13.0": 0.99
  "playbook:anthropic/claude-haiku-5-5": 0.78
