# Decision 2 (ADR-0040): incident or request?
#
# The answer space is the one the label set is labelled against
# (judgments/label_set/SPEC.md, d2-v1). Changing a definition changes what the
# labels mean, so it takes a new version, and a relabel.
id: d2
version: d2-v1
kind: choice
question: Is this Work item an incident or a service request?
answers:
  incident: >-
    Something is broken or degraded. It worked, or should work, and doesn't.
  service_request: >-
    An ask for something standard: access, an account, software, hardware, a
    change to a mailbox or group. Nothing is broken.
# Set from the label set, never guessed (SPEC §7): the lowest probability at
# which the items routed without a person are at least 95% right. Keyed by the
# engine it was measured on: a probability is on its engine's own scale, so
# the stage refuses to start when the engine that would decide has no entry
# here (#274). The Playbook's model has none: its 0.75 in the report was
# measured on claude-haiku-4-5, and classification now runs on
# claude-haiku-5-5, so without TYPESAFE_API_KEY the stage refuses until that
# is measured.
#
# 0.94 on Jev's probability (typesafe:jev-1.13.0), from
# judgments/label_set/report_v1.md, run on 2026-10-11: at 0.94, 208 of its 240
# answers (three passes over 80 rows) route without a person and 95.2% of
# those are right. The stage applies it to its primary engine only; an answer
# from the fallback always goes to a person. Measured on the same 80 rows it
# is reported on, with no held-out split, so measure it again when the label
# set grows or JEV_MODEL changes.
thresholds:
  "typesafe:jev-1.13.0": 0.94
