# Decision 3 (ADR-0040): already open?
#
# Asked of an Incident that has open Work items filed in the last hour, which
# code lists from the source (a JQL query on JSM); the model only picks. A
# Choice: each open Work item is an answer, keyed by its key, and `none` is
# the file's own. A match that clears its cut is named in the write-back
# comment, for a person to link; OpsPilot links, merges and closes nothing
# (ADR-0006, ADR-0013). Below its cut, nothing is said. The answer space the
# label set's already-open sets are labelled against
# (judgments/label_set/SPEC.md, d3-v1).
id: d3
version: d3-v1
kind: choice
question: >-
  Does this Work item report the same problem as one of these open Work items,
  filed in the last hour?
# What each open Work item means as an answer, {text} being what it says.
candidates: >-
  The same problem as this open Work item: {text}
answers:
  none: >-
    None of them: it is a different problem, even if on the same subject.
# Set from the label set, never guessed (SPEC §7), keyed by the engine it was
# measured on (#274). The stage acts only on a match, so each is the cut in
# judgments/label_set/report_d3_v1.md, run on 2026-10-16 over the 78 items,
# three passes each: the lowest probability at which the matches named are at
# least 95% right.
#
# 0.79 on Jev's probability: 122 of 234 answers name a match, 95.1% rightly;
#   116 of the 117 labelled matches, and 6 of the 117 labelled none.
# 0.72 on the Playbook's model: 123 named, 95.1% rightly; all 117 labelled
#   matches, and 6 of the 117 labelled none.
#
# The matches are duplicates drafted for this (SPEC §5), so they may be
# plainer than real ones. Measure again when there are real duplicates to
# label, or when either model changes.
thresholds:
  "typesafe:jev-1.13.0": 0.79
  "playbook:anthropic/claude-haiku-5-5": 0.72
