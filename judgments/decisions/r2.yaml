# The request path, second (ADR-0040, #293): is it really a request?
#
# Asked of a Work item on the request path, declared a request or decided
# one, after its catalog item. A Choice. An `incident` that clears its cut takes
# the incident path instead; a `change` goes to a person, OpsPilot having no
# change path; a `request`, or anything below the cut, stays on the request
# path. The answer space the label set's `really` column is labelled against
# (judgments/label_set/SPEC.md, r2-v1); the set's Incidents count as
# `incident`, by their type.
id: r2
version: r2-v1
kind: choice
question: >-
  This Work item was filed as a service request. Is it really one?
answers:
  request: >-
    An ask for something standard for a person: access, an account, software,
    hardware, a change to their mailbox or groups. Nothing is broken.
  incident: >-
    Something is broken or degraded: it worked, or should work, and doesn't.
  change: >-
    A change to a shared service or its configuration, not a standard ask for
    a person: a DNS record, a firewall rule, a server or network setting, a new
    integration.
# Set from the label set, never guessed (SPEC §7), keyed by the engine it was
# measured on (#274). `request` and an answer below the cut take the same way,
# so each is the cut on the other answers in judgments/label_set/report_r2_v1.md,
# run on 2026-10-17 over all 80 rows as if filed as requests, three passes each:
# the lowest probability at which the incidents and changes named are at least
# 95% right.
#
# 0.71 on Jev's probability: 154 of 240 answers name one, 95.5% rightly; 132 of
#   the 141 incident answers and 15 of the 33 change answers, and 4 of the 66
#   request answers named an incident.
# 0.75 on the Playbook's model: 131 named, 96.2% rightly; 111 of 141 and 15 of
#   33, and 2 of 66.
#
# Both engines miss most changes, calling them requests. Measure again when the
# label set grows, or when either model changes.
thresholds:
  "typesafe:jev-1.13.0": 0.71
  "playbook:anthropic/claude-haiku-5-5": 0.75
