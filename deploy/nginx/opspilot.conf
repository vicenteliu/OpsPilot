server {
    listen 80;
    server_name _;

    # Re-resolve the api service per request instead of once at startup.
    #
    # With a literal `proxy_pass http://api:8000`, nginx resolves the name
    # while loading the config and caches the address for the life of the
    # process. Recreating the api container — which every image upgrade does —
    # gives it a new address, and nginx keeps connecting to the old one: every
    # request 502s with "connect() failed (113: Host is unreachable)" until
    # nginx itself is restarted. Naming the upstream through a variable defers
    # resolution to request time; 127.0.0.11 is Docker's embedded DNS.
    # ipv6=off because the compose network is v4-only, so the AAAA lookups
    # would only add noise to the error log.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # API backend
    location / {
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health and metrics are proxied through but can also be scraped directly
    location /health  { proxy_pass $api/health;  }
    location /metrics { proxy_pass $api/metrics; }
}
