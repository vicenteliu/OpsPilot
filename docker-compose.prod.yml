# OpsPilot production Docker Compose (PR-32)
# Usage:
#   cp .env.example .env.prod  # fill in keys
#   docker compose -f docker-compose.prod.yml up -d
#
# .env.prod must set OPSPILOT_API_TOKEN: the api service binds 0.0.0.0, and
# that is fail-closed without a token (ADR-0011) — the container would exit.
# Embeddings default to OpenAI, so OPENAI_API_KEY is what the default stack
# needs; Ollama is behind the `ollama` profile.

services:
  api:
    image: opspilot:latest
    build:
      context: .
      dockerfile: Dockerfile
    # The image's ENTRYPOINT is already `opspilot` — command is its arguments.
    command: ["serve", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "2", "--json-logs"]
    env_file: .env.prod
    environment:
      # Set here (not left to .env.prod) so the state dir always matches the
      # volume below. The image pre-creates this path owned by the non-root
      # user — a named volume mounted anywhere else is root-owned and the
      # server cannot create kb/ in it.
      OPSPILOT_HOME: /home/opspilot/.opspilot
      OPSPILOT_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - opspilot-data:/home/opspilot/.opspilot
      - ./playbooks:/home/opspilot/playbooks:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      # python, not curl — the runtime image ships ca-certificates + sqlite3
      # only. urlopen raises (non-zero exit) on anything but a 2xx.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Local models — opt-in via profile:
  #   docker compose -f docker-compose.prod.yml --profile ollama up -d
  # Embeddings default to OpenAI, so the stack runs without this. Start it for
  # local chat models, or with OPSPILOT_EMBED_PROVIDER=ollama in .env.prod for
  # local embeddings — and pull the model first:
  #   docker compose ... exec ollama ollama pull nomic-embed-text-v2-moe
  # The api service has no depends_on here: it must start whether or not this
  # profile is enabled.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # JSM intake adapter (ADR-0013) — opt-in via profile:
  #   docker compose -f docker-compose.prod.yml --profile jsm up -d
  # Needs JSM_BASE_URL / JSM_EMAIL / JSM_API_TOKEN / JSM_JQL in .env.prod.
  jsm-source:
    image: opspilot:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["jsm"]
    # A shell is needed to expand the JSM_* vars, so the `opspilot` ENTRYPOINT
    # is replaced rather than extended.
    entrypoint: ["sh", "-c"]
    # One list item, not a plain string: a string command is split into argv,
    # and `sh -c` would then run only its first word.
    command:
      - >
        opspilot source jsm
        --base-url "$$JSM_BASE_URL"
        --email "$$JSM_EMAIL"
        --jql "$$JSM_JQL"
        --interval "$${JSM_POLL_INTERVAL:-60}"
        --state /home/opspilot/.opspilot/intake_state.json
        --api-url http://api:8000
    env_file: .env.prod
    volumes:
      - opspilot-data:/home/opspilot/.opspilot
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/opspilot.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  opspilot-data:
  ollama-data:
